[package]
name = "archive-studio-gui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "archive-studio"
path = "src/main.rs"

[dependencies]
archive-core = { path = "../core" }
archive-logging = { path = "../logging" }
# The clipboard for copying files (Slint's own clipboard only takes text): the same crates
# Slint's winit backend uses for it.
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
wl-clipboard-rs = "0.9"
log = "0.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp"] }
libc = "0.2"
# Decoding pictures for thumbnails and Details (optimized in debug builds: see ../Cargo.toml).
picture = { path = "../utils/picture" }
png = "0.18.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
slint = "1.8"

[build-dependencies]
slint-build = "1.8"

[dev-dependencies]
tempfile = "3.27.0"
