[package]
name = "faces"
version = "0.1.0"
edition = "2024"

[dependencies]
image = { version = "0.25.10", default-features = false }
tract-onnx = "0.23.8"
# Multithreaded matrix products, for `set_threads`.
tract-linalg = { version = "0.23.8", features = ["multithread-mm"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff"] }
