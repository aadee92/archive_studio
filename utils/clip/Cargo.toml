[package]
name = "clip"
version = "0.1.0"
edition = "2024"

[dependencies]
image = { version = "0.25.10", default-features = false }
# CLIP's byte-pair tokenizer, with OpenAI's vocabulary built in.
instant-clip-tokenizer = "0.1.0"
tract-onnx = "0.23.8"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff"] }
